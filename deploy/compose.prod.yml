services:
  backend:
    environment:
      CREHN_RUNTIME_ENV: prod
      SPRINGDOC_API_DOCS_ENABLED: "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      ALIYUN_OSS_ENABLED: "true"
      ALIYUN_OSS_DEFAULT: ${ALIYUN_OSS_DEFAULT:-true}
      ALIYUN_OSS_CONFIG_KEY: ${ALIYUN_OSS_CONFIG_KEY:?ALIYUN_OSS_CONFIG_KEY is required}
      ALIYUN_OSS_ACCESS_KEY: ${ALIYUN_OSS_ACCESS_KEY:?ALIYUN_OSS_ACCESS_KEY is required}
      ALIYUN_OSS_SECRET_KEY: ${ALIYUN_OSS_SECRET_KEY:?ALIYUN_OSS_SECRET_KEY is required}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:?ALIYUN_OSS_BUCKET is required}
      ALIYUN_OSS_PREFIX: ${ALIYUN_OSS_PREFIX:-crehn-prod}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:?ALIYUN_OSS_ENDPOINT is required}
      ALIYUN_OSS_DOMAIN: ${ALIYUN_OSS_DOMAIN:-}
      ALIYUN_OSS_REGION: ${ALIYUN_OSS_REGION:?ALIYUN_OSS_REGION is required}
      ALIYUN_OSS_HTTPS: ${ALIYUN_OSS_HTTPS:-Y}
      ALIYUN_OSS_ACCESS_POLICY: ${ALIYUN_OSS_ACCESS_POLICY:-0}
    mem_limit: ${CREHN_BACKEND_MEMORY_LIMIT:-4g}
