services:
  minio:
    image: ${CREHN_MINIO_IMAGE:?CREHN_MINIO_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    command: ["server", "--address", ":9000", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${CREHN_MINIO_ROOT_USER:?CREHN_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${CREHN_MINIO_ROOT_PASSWORD:?CREHN_MINIO_ROOT_PASSWORD is required}
    volumes:
      - ${CREHN_DATA_ROOT:?CREHN_DATA_ROOT is required}/minio:/data
    ports:
      - "${CREHN_MINIO_API_BIND:?CREHN_MINIO_API_BIND is required}:${CREHN_MINIO_API_PORT:?CREHN_MINIO_API_PORT is required}:9000"
      - "${CREHN_MINIO_CONSOLE_BIND:?CREHN_MINIO_CONSOLE_BIND is required}:${CREHN_MINIO_CONSOLE_PORT:?CREHN_MINIO_CONSOLE_PORT is required}:9001"
    mem_limit: ${CREHN_MINIO_MEMORY_LIMIT:-512m}
    networks: [data]
    healthcheck:
      # pgsty/minio is intentionally minimal and does not include curl/wget/nc.
      # Port 9000 is the MinIO API listener; the shell and cat are present in the image.
      test: ["CMD-SHELL", "case \"$$(cat /proc/net/tcp)\" in *:2328*) exit 0;; *) exit 1;; esac"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio-init:
    image: ${CREHN_MINIO_MC_IMAGE:?CREHN_MINIO_MC_IMAGE is required}
    pull_policy: never
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set crehn http://minio:9000 "$${CREHN_MINIO_ROOT_USER}" "$${CREHN_MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        mc mb --ignore-existing "crehn/$${CREHN_MINIO_BUCKET}"
        mc version enable "crehn/$${CREHN_MINIO_BUCKET}"
    environment:
      CREHN_MINIO_ROOT_USER: ${CREHN_MINIO_ROOT_USER:?CREHN_MINIO_ROOT_USER is required}
      CREHN_MINIO_ROOT_PASSWORD: ${CREHN_MINIO_ROOT_PASSWORD:?CREHN_MINIO_ROOT_PASSWORD is required}
      CREHN_MINIO_BUCKET: ${CREHN_MINIO_BUCKET:?CREHN_MINIO_BUCKET is required}
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 96m
    networks: [data]

  backend:
    environment:
      SPRINGDOC_API_DOCS_ENABLED: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully
