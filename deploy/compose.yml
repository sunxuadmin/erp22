name: ${CREHN_COMPOSE_PROJECT_NAME:?CREHN_COMPOSE_PROJECT_NAME is required}

services:
  db:
    build:
      context: ..
      dockerfile: deploy/db/Dockerfile
      args:
        CREHN_VERSION: ${CREHN_VERSION:?CREHN_VERSION is required}
        CREHN_SOURCE_REVISION: ${CREHN_SOURCE_REVISION:?CREHN_SOURCE_REVISION is required}
    image: crehn-db:${CREHN_VERSION:-local}
    pull_policy: never
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${CREHN_DB_NAME:?CREHN_DB_NAME is required}
      MARIADB_USER: ${CREHN_DB_USERNAME:?CREHN_DB_USERNAME is required}
      MARIADB_PASSWORD: ${CREHN_DB_PASSWORD:?CREHN_DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${CREHN_DB_ROOT_PASSWORD:?CREHN_DB_ROOT_PASSWORD is required}
      CREHN_RUNTIME_ENV: ${CREHN_RUNTIME_ENV:?CREHN_RUNTIME_ENV is required}
      CREHN_BOOTSTRAP_ADMIN_USERNAME: ${CREHN_BOOTSTRAP_ADMIN_USERNAME:?CREHN_BOOTSTRAP_ADMIN_USERNAME is required}
      CREHN_BOOTSTRAP_ADMIN_PASSWORD_HASH: ${CREHN_BOOTSTRAP_ADMIN_PASSWORD_HASH:?CREHN_BOOTSTRAP_ADMIN_PASSWORD_HASH is required}
      CREHN_MINIO_ROOT_USER: ${CREHN_MINIO_ROOT_USER:-}
      CREHN_MINIO_ROOT_PASSWORD: ${CREHN_MINIO_ROOT_PASSWORD:-}
      CREHN_MINIO_BUCKET: ${CREHN_MINIO_BUCKET:-}
      CREHN_MINIO_PUBLIC_DOMAIN: ${CREHN_MINIO_PUBLIC_DOMAIN:-}
      TZ: Asia/Shanghai
    volumes:
      - ${CREHN_DATA_ROOT:?CREHN_DATA_ROOT is required}/mariadb:/var/lib/mysql
    mem_limit: ${CREHN_DB_MEMORY_LIMIT:-768m}
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: ${CREHN_REDIS_IMAGE:?CREHN_REDIS_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    environment:
      CREHN_REDIS_PASSWORD: ${CREHN_REDIS_PASSWORD:?CREHN_REDIS_PASSWORD is required}
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${CREHN_REDIS_PASSWORD}\""]
    volumes:
      - ${CREHN_DATA_ROOT:?CREHN_DATA_ROOT is required}/redis:/data
    mem_limit: ${CREHN_REDIS_MEMORY_LIMIT:-256m}
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${CREHN_REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        CREHN_VERSION: ${CREHN_VERSION:?CREHN_VERSION is required}
        CREHN_SOURCE_REVISION: ${CREHN_SOURCE_REVISION:?CREHN_SOURCE_REVISION is required}
        CREHN_MAVEN_OPTS: ${CREHN_MAVEN_OPTS:--Xmx1536m -XX:MaxMetaspaceSize=512m}
    image: crehn-backend:${CREHN_VERSION:-local}
    pull_policy: never
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CREHN_RUNTIME_ENV: ${CREHN_RUNTIME_ENV:?CREHN_RUNTIME_ENV is required}
      CREHN_DB_URL: jdbc:mysql://db:3306/${CREHN_DB_NAME:?CREHN_DB_NAME is required}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
      CREHN_DB_USERNAME: ${CREHN_DB_USERNAME:?CREHN_DB_USERNAME is required}
      CREHN_DB_PASSWORD: ${CREHN_DB_PASSWORD:?CREHN_DB_PASSWORD is required}
      CREHN_REDIS_HOST: redis
      CREHN_REDIS_PORT: 6379
      CREHN_REDIS_PASSWORD: ${CREHN_REDIS_PASSWORD:?CREHN_REDIS_PASSWORD is required}
      CREHN_JWT_SECRET: ${CREHN_JWT_SECRET:?CREHN_JWT_SECRET is required}
      CREHN_API_ENCRYPT_ENABLED: "false"
      CREHN_MAIL_ENABLED: "false"
      CREHN_SNAIL_JOB_ENABLED: "false"
      CREHN_MONITOR_ENABLED: "false"
      CREHN_MONITOR_USERNAME: ${CREHN_MONITOR_USERNAME:?CREHN_MONITOR_USERNAME is required}
      CREHN_MONITOR_PASSWORD: ${CREHN_MONITOR_PASSWORD:?CREHN_MONITOR_PASSWORD is required}
      CREHN_MAX_FILE_SIZE: ${CREHN_MAX_FILE_SIZE:-1GB}
      CREHN_MAX_REQUEST_SIZE: ${CREHN_MAX_REQUEST_SIZE:-10GB}
      CREHN_WORKBENCH_ASSET_DIR: /app/data/workbench-assets
      CREHN_PORTAL_LOCAL_PDF_DIR: /app/data/portal-pdf
      CREHN_OFFICE_WORKER_COUNT: ${CREHN_OFFICE_WORKER_COUNT:-1}
      CREHN_OFFICE_QUEUE_CAPACITY: ${CREHN_OFFICE_QUEUE_CAPACITY:-50}
      JAVA_TOOL_OPTIONS: >-
        -Dserver.undertow.threads.io=${CREHN_UNDERTOW_IO_THREADS:-4}
        -Dserver.undertow.threads.worker=${CREHN_UNDERTOW_WORKER_THREADS:-64}
        -Dspring.datasource.dynamic.hikari.maxPoolSize=${CREHN_HIKARI_MAX_POOL_SIZE:-20}
        -Dspring.datasource.dynamic.hikari.minIdle=${CREHN_HIKARI_MIN_IDLE:-5}
        -Dredisson.threads=${CREHN_REDISSON_THREADS:-4}
        -Dredisson.nettyThreads=${CREHN_REDISSON_NETTY_THREADS:-8}
        -Dredisson.singleServerConfig.connectionMinimumIdleSize=${CREHN_REDISSON_MIN_IDLE:-4}
        -Dredisson.singleServerConfig.connectionPoolSize=${CREHN_REDISSON_POOL_SIZE:-16}
        -Dredisson.singleServerConfig.subscriptionConnectionPoolSize=${CREHN_REDISSON_SUBSCRIPTION_POOL_SIZE:-8}
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${CREHN_DATA_ROOT:?CREHN_DATA_ROOT is required}/backend/logs:/app/logs
      - ${CREHN_DATA_ROOT:?CREHN_DATA_ROOT is required}/backend/tmp:/app/tmp
      - ${CREHN_DATA_ROOT:?CREHN_DATA_ROOT is required}/backend/workbench-assets:/app/data/workbench-assets
      - ${CREHN_DATA_ROOT:?CREHN_DATA_ROOT is required}/backend/portal-pdf:/app/data/portal-pdf
    mem_limit: ${CREHN_BACKEND_MEMORY_LIMIT:-2g}
    networks: [app, data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$${CREHN_MONITOR_USERNAME}:$${CREHN_MONITOR_PASSWORD}\" http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 30

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        CREHN_VERSION: ${CREHN_VERSION:?CREHN_VERSION is required}
        CREHN_SOURCE_REVISION: ${CREHN_SOURCE_REVISION:?CREHN_SOURCE_REVISION is required}
        CREHN_ADMIN_NODE_OPTIONS: ${CREHN_ADMIN_NODE_OPTIONS:---max-old-space-size=3072}
        CREHN_PORTAL_NODE_OPTIONS: ${CREHN_PORTAL_NODE_OPTIONS:---max-old-space-size=1024}
    image: crehn-web:${CREHN_VERSION:-local}
    pull_policy: never
    restart: unless-stopped
    environment:
      NGINX_CLIENT_MAX_BODY_SIZE: ${CREHN_NGINX_CLIENT_MAX_BODY_SIZE:-10g}
    ports:
      - "${CREHN_HTTP_BIND:?CREHN_HTTP_BIND is required}:${CREHN_HTTP_PORT:?CREHN_HTTP_PORT is required}:8080"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: ${CREHN_WEB_MEMORY_LIMIT:-128m}
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  app:
    internal: false
  data:
    internal: true
