--- # 临时文件存储位置 避免临时文件被系统清理报错
spring.servlet.multipart.location: ${RUOYI_UPLOAD_TEMP:${java.io.tmpdir}}

--- # 监控中心配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: ${CREHN_MONITOR_ENABLED:false}
  url: ${CREHN_MONITOR_URL:http://127.0.0.1:9090/admin}
  instance:
    service-host-type: IP
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: ${CREHN_MONITOR_USERNAME}
  password: ${CREHN_MONITOR_PASSWORD}

--- # snail-job 配置
snail-job:
  enabled: ${CREHN_SNAIL_JOB_ENABLED:false}
  # 需要在 SnailJob 后台组管理创建对应名称的组,然后创建任务的时候选择对应的组,才能正确分派任务
  group: ${CREHN_SNAIL_JOB_GROUP:crehn_group}
  # SnailJob 接入验证令牌 详见 script/sql/ry_job.sql `sj_group_config`表
  token: ${CREHN_SNAIL_JOB_TOKEN:}
  server:
    host: ${CREHN_SNAIL_JOB_HOST:127.0.0.1}
    port: ${CREHN_SNAIL_JOB_PORT:17888}
  # 命名空间UUID 详见 script/sql/ry_job.sql `sj_namespace`表`unique_id`字段
  namespace: ${spring.profiles.active}
  # 随主应用端口漂移
  port: 2${server.port}
  # 客户端ip指定
  host:

--- # 数据源配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # 动态数据源文档 https://www.kancloud.cn/tracy5546/dynamic-datasource/content
    dynamic:
      # 性能分析插件(有性能损耗 不建议生产环境使用)
      p6spy: false
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      # 严格模式 匹配不到数据源则报错
      strict: true
      datasource:
        # 主库数据源
        master:
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          # jdbc 所有参数配置参考 https://lionli.blog.csdn.net/article/details/122018562
          # rewriteBatchedStatements=true 批处理优化 大幅提升批量插入更新删除性能(对数据库有性能损耗 使用批量操作应考虑性能问题)
          url: ${CREHN_DB_URL}
          username: ${CREHN_DB_USERNAME}
          password: ${CREHN_DB_PASSWORD}
#        # 从库数据源
#        slave:
#          lazy: true
#          type: ${spring.datasource.type}
#          driverClassName: com.mysql.cj.jdbc.Driver
#          url: jdbc:mysql://localhost:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
#          username:
#          password:
#        oracle:
#          type: ${spring.datasource.type}
#          driverClassName: oracle.jdbc.OracleDriver
#          url: jdbc:oracle:thin:@//localhost:1521/XE
#          username: ROOT
#          password: ${CREHN_ORACLE_PASSWORD:}
#        postgres:
#          type: ${spring.datasource.type}
#          driverClassName: org.postgresql.Driver
#          url: jdbc:postgresql://localhost:5432/postgres?useUnicode=true&characterEncoding=utf8&useSSL=true&autoReconnect=true&reWriteBatchedInserts=true
#          username: root
#          password: ${CREHN_POSTGRES_PASSWORD:}
#        sqlserver:
#          type: ${spring.datasource.type}
#          driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
#          url: jdbc:sqlserver://localhost:1433;DatabaseName=tempdb;SelectMethod=cursor;encrypt=false;rewriteBatchedStatements=true
#          username: SA
#          password: ${CREHN_SQLSERVER_PASSWORD:}
      hikari:
        # 最大连接池数量
        maxPoolSize: 20
        # 最小空闲线程数量
        minIdle: 10
        # 配置获取连接等待超时的时间
        connectionTimeout: 30000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 多久检查一次连接的活性
        keepaliveTime: 30000

--- # redis 单机配置(单机与集群只能开启一个另一个需要注释掉)
spring.data:
  redis:
    # 地址
    host: ${CREHN_REDIS_HOST:127.0.0.1}
    # 端口，默认为6379
    port: ${CREHN_REDIS_PORT:6379}
    # 数据库索引
    database: ${CREHN_REDIS_DATABASE:0}
    # redis 密码必须配置
    password: ${CREHN_REDIS_PASSWORD}
    # 连接超时时间
    timeout: 10s
    # 是否开启ssl
    ssl.enabled: false

# redisson 配置
redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量
  threads: 16
  # Netty线程池数量
  nettyThreads: 32
  # 单节点配置
  singleServerConfig:
    # 客户端名称 不能用中文
    clientName: CREHN
    # 最小空闲连接数
    connectionMinimumIdleSize: 32
    # 连接池大小
    connectionPoolSize: 64
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50

--- # 阿里云 OSS 对象存储。启用后会在启动时写入 sys_oss_config 并作为默认上传配置
crehn:
  oss:
    aliyun:
      enabled: ${ALIYUN_OSS_ENABLED:false}
      default-config: ${ALIYUN_OSS_DEFAULT:true}
      config-key: ${ALIYUN_OSS_CONFIG_KEY:aliyun}
      access-key: ${ALIYUN_OSS_ACCESS_KEY:}
      secret-key: ${ALIYUN_OSS_SECRET_KEY:}
      bucket-name: ${ALIYUN_OSS_BUCKET:}
      prefix: ${ALIYUN_OSS_PREFIX:crehn}
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      domain: ${ALIYUN_OSS_DOMAIN:}
      region: ${ALIYUN_OSS_REGION:}
      is-https: ${ALIYUN_OSS_HTTPS:Y}
      access-policy: ${ALIYUN_OSS_ACCESS_POLICY:0}

--- # mail 邮件发送
mail:
  enabled: ${CREHN_MAIL_ENABLED:false}
  host: ${CREHN_MAIL_HOST:}
  port: ${CREHN_MAIL_PORT:465}
  # 是否需要用户名密码验证
  auth: true
  # 发送方，遵循RFC-822标准
  from: ${CREHN_MAIL_FROM:}
  # 用户名（注意：如果使用foxmail邮箱，此处user为qq号）
  user: ${CREHN_MAIL_USER:}
  # 密码（注意，某些邮箱需要为SMTP服务单独设置密码，详情查看相关帮助）
  pass: ${CREHN_MAIL_PASSWORD:}
  # 使用 STARTTLS安全连接，STARTTLS是对纯文本通信协议的扩展。
  starttlsEnable: true
  # 使用SSL安全连接
  sslEnable: true
  # SMTP超时时长，单位毫秒，缺省值不超时
  timeout: 0
  # Socket连接超时值，单位毫秒，缺省值不超时
  connectionTimeout: 0

--- # 短信和第三方授权初期关闭；真实供应商确认后再增加环境配置
sms:
  config-type: yaml
  restricted: true
  minute-max: 1
  account-max: 30
  blends: {}

justauth:
  address: ${CREHN_PUBLIC_URL:http://127.0.0.1}
  type: {}
